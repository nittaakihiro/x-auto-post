name: Send Dashboard to Slack

# dashboard.json が変わった時だけ通知する（= 生成ルーティン3本の直後、1日3回）。
# 旧: post_queue.json も対象だったため、posterのstatus更新のたびに同じ内容のDMが1日6〜10回飛んでいた。
on:
  push:
    paths:
      - 'output/dashboard.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and send Slack message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: U01PHHAB887
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          today = datetime.now(JST).strftime("%Y-%m-%d")
          today_jp = datetime.now(JST).strftime("%Y年%-m月%-d日")
          weekdays = ["月", "火", "水", "木", "金", "土", "日"]
          day_of_week = weekdays[datetime.now(JST).weekday()]

          # Load queue
          with open("output/post_queue.json", "r") as f:
              queue = json.load(f)
          today_posts = [p for p in queue if p["date"] == today and p["status"] in ("pending", "draft")]

          # Load dashboard (engage cards + reply sales)
          dashboard = {}
          dash_path = Path("output/dashboard.json")
          if dash_path.exists():
              with open(dash_path, "r") as f:
                  dashboard = json.load(f)

          # 今回の枠 = generated_at_* が一番新しい枠（朝=original_post/07:25, 昼=noon_post/12:00, 夕=evening_post/20:00, 夜=night_post/21:00）。
          # 旧: original_post 固定だったため昼以降のDMに朝の下書きが再送されていた（2026-09-09修正）
          SLOTS = {"morning": ("original_post", "07:25"), "noon": ("noon_post", "12:00"), "evening": ("evening_post", "20:00"), "night": ("night_post", "21:00")}
          latest = max(SLOTS, key=lambda k: dashboard.get(f"generated_at_{k}") or "")
          if not dashboard.get(f"generated_at_{latest}"):
              latest = "morning"
          if dashboard.get("version") == 6:
              latest = dashboard["slot"]
          slot_key, slot_time = SLOTS[latest]
          if dashboard.get("version") == 6:
              slot_key = "original_post"
              if dashboard.get("skip_reason"):
                  print("編集判断による休載:", dashboard["skip_reason"])
                  exit(0)
          current = dashboard.get(slot_key) or {}
          if isinstance(current, str):
              current = {"time": slot_time, "text": current}
          current_time = current.get("time") or slot_time
          if dashboard.get("date") != today:
              print("古いダッシュボードの再送をスキップ")
              exit(0)
          today_posts = [p for p in today_posts if p.get("time") == current_time]
          engage_cards = dashboard.get("engage_cards", [])[:2]
          reply_sales = dashboard.get("reply_sales", [])
          repost_morning = dashboard.get("repost_morning", [])
          repost_noon = dashboard.get("repost_noon", [])
          repost_evening = dashboard.get("repost_evening", [])
          repost_night = dashboard.get("repost_night", [])

          if not today_posts and not engage_cards and not (repost_morning or repost_noon or repost_evening or repost_night):
              print("今日のコンテンツなし。スキップ。")
              exit(0)

          def slack_api(method, payload):
              req = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
                      "Content-Type": "application/json; charset=utf-8"
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Open DM
          open_result = slack_api("conversations.open", {"users": os.environ["SLACK_USER_ID"]})
          if not open_result.get("ok"):
              print(f"DM open失敗: {open_result.get('error')}")
              exit(1)
          dm_channel = open_result["channel"]["id"]

          # === Build blocks ===
          blocks = [
              {"type": "header", "text": {"type": "plain_text", "text": f"📋 X Dashboard — {today_jp}（{day_of_week}）"}},
              {"type": "divider"}
          ]

          # --- オリジナル（v4.1: draft=新田さんがリライトして手動投稿 / pending=自動投稿） ---
          if today_posts:
              has_draft = any(p["status"] == "draft" for p in today_posts)
              label = "*🖊️ 今回の投稿案（画像・出典を確認して投稿）*" if has_draft else "*🖊️ オリジナル投稿（自動投稿）*"
              blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": label}})
              for p in sorted(today_posts, key=lambda x: x["time"]):
                  freshness = "🔒" if p.get("freshness") == "locked" else "🔄"
                  img = "🖼️" if p.get("image", {}).get("type") in ("gemini", "screenshot") else ""
                  if p["status"] == "draft":
                      line = f"*{p['time']}枠（目安。ズレてOK）* {img} — {len(p['text'])}字\n```{p['text']}```"
                      if p.get("hint"):
                          line += f"\n💡 *解釈の種:* {p['hint']}"
                      if p.get("quote_tweet_id"):
                          line += f"\n🔁 *引用先:* https://x.com/i/status/{p['quote_tweet_id']}"
                      if p.get("video_url"):
                          line += f"\n🎬 *動画素材（権利・表示を投稿画面で確認。画像は不要）:* {p['video_url']}"
                      if p.get("article_url"):
                          line += f"\n📎 *出典（内容・利用条件を確認。ニュースサイトのスクショは不要）:* {p['article_url']}"
                  else:
                      line = f"*{p['time']}* {freshness} {img} — {len(p['text'])}字\n\n{p['text']}"
                  editorial = p.get("editorial") or {}
                  if editorial.get("selection_reason"):
                      line += f"\n🧭 *採用理由:* {editorial['selection_reason']}"
                  if editorial.get("unverified"):
                      line += f"\n*未確認:* {editorial['unverified']}"
                  blocks.append({
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": line}
                  })
                  if p.get("reply") and p["reply"].get("text"):
                      blocks.append({
                          "type": "context",
                          "elements": [{"type": "mrkdwn", "text": f"💬 *■補足（投稿後に自己リプ）:*\n{p['reply']['text']}"}]
                      })
                  blocks.append({"type": "divider"})

          # --- 絡みカード（手動投稿・v4: コピペ10秒が目的。完成文を先頭に置く） ---
          if engage_cards:
              blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": "*🤝 引用・リプのおすすめ（任意・原投稿を確認）*"}})
              for i, card in enumerate(engage_cards, 1):
                  card_type = card.get("action_type") or card.get("type", "reply")
                  tier = card.get("tier", "")
                  target = card.get("target") or card.get("target_account") or card.get("author", "")
                  name = card.get("name", "")
                  url = card.get("target_post_url") or card.get("url", "")
                  summary = card.get("target_summary") or card.get("target_snippet") or card.get("snippet", "")
                  text = card.get("text") or card.get("reply_text") or card.get("draft", "")
                  label = "引用RT" if "quote" in card_type else "リプ"
                  header = f"*[{label}] {target}*"
                  if name:
                      header += f" ({name})"
                  if tier:
                      header += f" [{tier} tier]"
                  line = f"{header}\n```{text}```"
                  if url:
                      line += f"\n→ 投稿先: {url}"
                  if summary:
                      line += f"\n> {summary}"
                  blocks.append({
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": line}
                  })
                  blocks.append({"type": "divider"})

          # --- リプ営業（手動投稿） ---
          if reply_sales:
              blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": "*📣 リプ営業候補（手動投稿）*"}})
              for i, rs in enumerate(reply_sales, 1):
                  target = rs.get("target_description") or rs.get("target_account", "")
                  url = rs.get("target_url") or rs.get("url", "")
                  snippet = rs.get("snippet", "")
                  query = rs.get("search_query", "")
                  text = rs.get("reply_text") or rs.get("text", "")
                  line = f"{i}. *{target}*"
                  if url:
                      line += f"\n{url}"
                  if snippet:
                      line += f"\n> {snippet}"
                  if query:
                      line += f"\n検索: `{query}`"
                  line += f"\n💬 {text}"
                  blocks.append({
                      "type": "context",
                      "elements": [{"type": "mrkdwn", "text": line}]
                  })
              blocks.append({"type": "divider"})

          # --- リポスト候補（朝/昼/夜 各5件） ---
          def render_reposts(label, items):
              if not items:
                  return
              blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": f"*🔁 {label}（手動RT・{len(items)}件）*"}})
              for i, r in enumerate(items, 1):
                  url = r.get("url", "")
                  author = r.get("author", "")
                  snippet = r.get("snippet", "")
                  eng = r.get("engagement", {}) or {}
                  reason = r.get("reason", "")
                  likes = eng.get("likes", "?")
                  rts = eng.get("rts", "?")
                  line = f"{i}. *{author}* ❤️{likes} 🔁{rts}"
                  if url:
                      line += f"\n{url}"
                  if snippet:
                      line += f"\n> {snippet}"
                  if reason:
                      line += f"\n💡 {reason}"
                  blocks.append({
                      "type": "context",
                      "elements": [{"type": "mrkdwn", "text": line}]
                  })
              blocks.append({"type": "divider"})

          render_reposts("リポスト候補・朝枠", repost_morning)
          render_reposts("リポスト候補・昼枠", repost_noon)
          render_reposts("リポスト候補・夜枠", repost_evening)
          render_reposts("リポスト候補・海外翻訳枠（そのままRTでOK）", repost_night)

          # --- サマリー ---
          summary_parts = []
          if today_posts:
              n_draft = sum(1 for p in today_posts if p["status"] == "draft")
              if n_draft:
                  summary_parts.append(f"📝 下書き{n_draft}本（リライトして手動投稿）")
              if len(today_posts) - n_draft:
                  summary_parts.append(f"📝 オリジナル{len(today_posts) - n_draft}本（自動投稿）")
          if engage_cards:
              summary_parts.append(f"🤝 絡み{len(engage_cards)}本（手動）")
          if reply_sales:
              summary_parts.append(f"📣 リプ営業{len(reply_sales)}件（手動）")
          repost_total = len(repost_morning) + len(repost_noon) + len(repost_evening) + len(repost_night)
          if repost_total:
              summary_parts.append(f"🔁 リポスト候補{repost_total}件（手動）")
          blocks.append({
              "type": "context",
              "elements": [{"type": "mrkdwn", "text": " | ".join(summary_parts)}]
          })

          # === Send ===
          # Slack blocks limit is 50, split if needed
          MAX_BLOCKS = 50
          for i in range(0, len(blocks), MAX_BLOCKS):
              chunk = blocks[i:i+MAX_BLOCKS]
              result = slack_api("chat.postMessage", {
                  "channel": dm_channel,
                  "blocks": chunk,
                  "text": f"X Dashboard — {today_jp}（{day_of_week}）"
              })
              if not result.get("ok"):
                  print(f"Slack送信失敗: {result.get('error')}")
                  exit(1)

          print(f"Slack送信成功: {today_jp}")
          PYEOF

      # v6: 明示的に画像を選んだ今回の投稿だけ生成。none・動画はスキップ。
      - name: Make post images and send to DM
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: U01PHHAB887
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q google-genai Pillow playwright
          python -m playwright install --with-deps chromium > /dev/null 2>&1 || true
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          today = datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          dashboard = json.load(open('output/dashboard.json'))
          SLOTS = {"morning": "07:25", "noon": "12:00", "evening": "20:00", "night": "21:00"}
          latest = max(SLOTS, key=lambda k: dashboard.get(f"generated_at_{k}") or "")
          if dashboard.get("version") == 6:
              if dashboard.get("skip_reason"):
                  exit(0)
              latest = dashboard["slot"]
          slot_time = SLOTS[latest]
          if dashboard.get('date') == today:
              subprocess.run(['python3', 'scripts/make_post_image.py', '--post-id', today + '_' + slot_time, '--slack-dm'], check=True)
          PY
