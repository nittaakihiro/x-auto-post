name: Fetch News Feed

# v5（チャエン型運用）の一次ソース。AI海外/国内・建設テックのRSSを2時間毎に集めて output/news_feed.json に置く。
# 生成ルーティン（x-post-morning/noon/evening）はこのファイルを最初に読む。

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RSS feeds
        run: |
          mkdir -p output
          python3 scripts/fetch_news.py --hours 48 --out output/news_feed.json

      - name: Commit if changed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add output/news_feed.json
          git diff --cached --quiet || git commit -m "update: news feed snapshot"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
