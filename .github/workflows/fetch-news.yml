name: Fetch News Feed

# v5（チャエン型運用）の一次ソース。AI海外/国内・建設テックのRSSを2時間毎に集めて output/news_feed.json に置く。
# 生成ルーティン（x-post-morning/noon/evening）はこのファイルを最初に読む。

on:
  schedule:
    - cron: '15 */2 * * *'
    - cron: '45 * * * *'
    - cron: '15 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RSS feeds (+ 日本語訳)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATE_THIS_RUN: ${{ github.event.schedule == '15 */2 * * *' }}
        run: |
          mkdir -p output
          if [ "$TRANSLATE_THIS_RUN" = "true" ]; then
            python3 scripts/fetch_news.py --hours 48 --out output/news_feed.json --translate
          else
            python3 scripts/fetch_news.py --hours 48 --out output/news_feed.json
          fi

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/news_feed.json
          git diff --cached --quiet && exit 0
          git commit -m "update: news feed snapshot"
          git pull --rebase origin main
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
