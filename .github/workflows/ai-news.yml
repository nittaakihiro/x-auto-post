name: Collect AI News
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-news-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect free official feeds and notify new candidates
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: U01PHHAB887
        run: python3 scripts/collect_ai_news.py --notify
      - name: Save discovery history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f output/ai_news.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/ai_news.json
          git diff --cached --quiet && exit 0
          git commit -m 'news: update primary source candidates'
          git pull --rebase origin main
          git push origin HEAD:main
